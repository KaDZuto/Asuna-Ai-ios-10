<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<script src="www/libs/pixi.min.js"></script>
<script src="www/libs/live2d.min.js"></script>
<script src="www/libs/cubism2.min.js"></script>
<script>
const app = new PIXI.Application({
  view: document.getElementById('c'),
  width: 400,
  height: 600,
  transparent: true
});

PIXI.live2d.Live2DModel.from('www/models/asuna_01/asuna_01.model.json').then(model => {
  model.scale.set(0.2);
  model.x = 200;
  model.y = 300;
  app.stage.addChild(model);
  
  const core = model.internalModel.coreModel;
  const drawParam = core.drawParamWebGL;
  console.log('matrix4x4:', Array.from(drawParam.matrix4x4));
  console.log('culling:', drawParam.culling);
  console.log('clipBufPre_clipContextDraw:', drawParam.getClipBufPre_clipContextDraw());
  console.log('clipBufPre_clipContextMask:', drawParam.clipBufPre_clipContextMask);
});
</script>
</body>
</html>
