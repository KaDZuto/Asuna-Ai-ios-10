<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>html,body{margin:0;background:#222}</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<script>
window.__mode = new URLSearchParams(location.search).get('mode')||'webgl1';
</script>
<script src="www/libs/pixi.min.js"></script>
<script>
if (window.__mode==='webgl1') { PIXI.settings.PREFER_ENV = PIXI.ENV.WEBGL; }
if (window.__mode==='legacy') { PIXI.settings.PREFER_ENV = PIXI.ENV.WEBGL_LEGACY; }
PIXI.settings.PRECISION_VERTEX = 'highp';
PIXI.settings.PRECISION_FRAGMENT = 'highp';
</script>
<script src="www/libs/live2d.min.js"></script>
<script src="www/libs/cubism2.min.js"></script>
<script>
const app = new PIXI.Application({ view: document.getElementById('c'), width:400, height:600, transparent:true, antialias:false, preserveDrawingBuffer:true });
console.log('RENDERER', app.renderer.type, 'WEBGL?', app.renderer.context.webGLVersion, 'mode', window.__mode);
PIXI.live2d.Live2DModel.from('www/models/asuna_01/asuna_01.model.json').then(model=>{
  model.anchor.set(0.5,0.5);
  model.scale.set(0.2); model.x=200; model.y=300;
  app.stage.addChild(model);
  window.__ready = true;
}).catch(e=>{ console.error('LOAD ERR', e); window.__err=String(e); });
</script>
</body>
</html>
